#
#   Z690_Extreme.conf
#   lm-sensors configuration file for ASRock Z690 Extreme (WiFi 6E) motherboards.
#
#   Vendor website: https://www.asrock.com/mb/Intel/Z690%20Extreme/index.asp
#   Original github project: https://github.com/petersulyok/asrock_z690_extreme
#
#   dmidecode:
#       Manufacturer: ASRock
#       Product Name: Z690 Extreme
#   dmesg: nct6775: Found NCT6798D or compatible chip at 0x2e:0x2a0
#
#   This file is for the current nct6775 driver: Linux 6.5+ and 6.1.183+ (kernel commit 13558a2e,
#   "hwmon: (nct6775) Fix IN scaling factors for 6798/6799"). With older kernels (4.20 - 6.4, except
#   6.1.183+) uncomment the two "compute" lines of in10 and in11 below. Quick check, independent of
#   the kernel version:
#       cat /sys/class/hwmon/hwmon*/in10_input     ~1056 -> no change needed, ~528 -> uncomment them
#

# Nuvoton NCT6796D-E super IO chip (recognized differently by lm-sensors)
chip "nct6798-isa-02a0"

    # 1. voltages
    label   in0         "CPU Vcore"
    set     in0_min     0.2
    set     in0_max     2.04
    set     in0_beep    1

    label   in1         "+5.0V"
    compute in1         @*(24/8), @/(24/8)
    set     in1_min     5 * 0.9
    set     in1_max     5 * 1.1
    set     in1_beep    1

    ignore  in2

    label   in3         "+3.3V"
    set     in3_min     3.3 * 0.9
    set     in3_max     3.3 * 1.1
    set     in3_beep    1

    label   in4         "+12V"
    compute in4         @*12, @/12
    set     in4_min     12 * 0.95
    set     in4_max     12 * 1.05
    set     in4_beep    1

    label   in5         "VCCIN_AUX"
    compute in5         @*2, @/2
    set     in5_min     1.7
    set     in5_max     2.5
    set     in5_beep    1

    label   in6         "DRAM"
    set     in6_min     1.1
    set     in6_max     1.65
    set     in6_beep    1

    ignore  in7
    ignore  in8
    ignore  in9

    label   in10        "+1.05V PROC"
#   compute in10        @*2, @/2            # uncomment for older kernels, see the header
    set     in10_min    0.95
    set     in10_max    1.8
    set     in10_beep   1

    label   in11        "+0.82V PCH"
#   compute in11        @*2, @/2            # uncomment for older kernels, see the header
    set     in11_min    0.72
    set     in11_max    1.3
    set     in11_beep   1

    label   in12        "+1.05V PCH"
    compute in12        @+0.05, @-0.05
    set     in12_min    0.95
    set     in12_max    1.5
    set     in12_beep   1

    label   in13        "VCCSA"
    compute in13        @*2, @/2
    set     in13_min    0.95
    set     in13_max    2.0
    set     in13_beep   1

    ignore  in14

    # 2. fans
    label   fan1        "Chassis fan3"
    label   fan2        "CPU fan1"
    set     fan2_min    200
    set     fan2_beep   1
    label   fan3        "CPU fan2"
    label   fan4        "Chassis fan1"
    label   fan5        "Chassis fan2"
    label   fan6        "Chassis fan4"
    label   fan7        "Chassis fan5"

    # 3. temperatures
    label   temp1       "Motherboard" # SYSTIN
    ignore  temp2       # CPUTIN
    ignore  temp3       # AUXTIN0
    ignore  temp4       # AUXTIN1
    ignore  temp5       # AUXTIN2
    ignore  temp6       # AUXTIN3
    label   temp7       "CPU" # PECI Agent 0
    ignore  temp8       # AUXTIN4
    ignore  temp9       # PCH_CHIP_CPU_MAX_TEMP
    ignore  temp10      # PCH_CHIP_TEMP
    ignore  temp11      # PCH_CPU_TEMP
    ignore  temp12      # PCH_MCH_TEMP

    # 4. fan control outputs (not needed for monitoring)
    ignore  pwm1
    ignore  pwm2
    ignore  pwm3
    ignore  pwm4
    ignore  pwm5
    ignore  pwm6
    ignore  pwm7

    # 5. other
    set     beep_enable 1
    ignore  intrusion0
    ignore  intrusion1

# End
