# MSI MAG B850M MORTAR WIFI (MS-7E61)
#
# For the in-kernel nct6683 driver (NCT6687D). Channel numbering differs
# from the out-of-tree nct6687 driver used by other MSI configs here.
# Tested with EC firmware 0.0 build 03/10/25, BIOS 1.A66 and 1.A68,
# kernels 7.2.5-200.fc44 and 7.2.15-300.fc45.
#
# Fan headers identified by forcing single fans to 100% in BIOS: the EC
# numbers the SYS headers in reverse order. CPU Core identified by CPU
# load test, MOS by a 2-minute all-core load (only it rose, +5 C).
# Remaining labels cross-checked against HWiNFO on the same machine.

chip "nct6687-isa-*"

    # Voltages
    label in0 "+12V"
    compute in0 @*12, @/12
    label in1 "+5V"
    compute in1 @*5, @/5
    label in2 "CPU NB/SOC"
    label in3 "CPU VDDIO"
    compute in3 @*2, @/2
    label in4 "CPU Core"
    label in8 "+3.3V"
    # in5-in7 (VIN5-VIN7) read non-zero, but no known rail: neither the
    # vendor software nor HWiNFO shows them for this board
    ignore in5
    ignore in6
    ignore in7

    # Fans
    label fan1  "CPU Fan 1"
    label fan2  "PUMP SYS Fan 1"
    # EZ Conn header (JAF_1)
    label fan4  "EZ Conn Fan"
    label fan16 "SYS Fan 1"
    label fan15 "SYS Fan 2"
    label fan14 "SYS Fan 3"
    label fan13 "SYS Fan 4"
    # fan2 and fan4 were not connected on the test machine; their mapping
    # follows the vendor software's fan table for this board.
    # fan3 has no header on this board (not in that table, PWM output 0)
    ignore fan3

    # Temperatures
    label temp1 "CPU"
    label temp2 "System"
    label temp3 "MOS"
    label temp4 "Chipset A"
    # temp5 reads the same source as temp3 (Thermistor 15)
    ignore temp5
